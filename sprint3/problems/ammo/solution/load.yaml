overload:
  enabled: false

phantom:
  address: host.docker.internal:8080 
  ammofile: ammo.txt
  ammo_type: uri
  load_profile:
    load_type: rps
    schedule: line(10, 100, 1m)        
      ssl: false

autostop:
  enabled: true
  autostop:
    - http(5xx,10%,5s)                  

console:
  enabled: true

telegraf:
  enabled: false